{% extends "base.html" %}

{% block title %}Login | TaskFlow{% endblock %}

{% block content %}

<main class="auth-wrapper">
    <section class="auth-card">

        <h1>Welcome Back</h1>
        <p>Login to continue managing your tasks.</p>

        <form method="POST" action="{{ url_for('login') }}" autocomplete="off">

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="full-button">Login</button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

    </section>
</main>

{% endblock %}
