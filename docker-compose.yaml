services:
   mysql:
    image: mysql:8.0
    container_name: mysql
    networks:
      - three-tier
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops
    volumes:
      - ./mysql-data:/var/lib/mysql

   flask-app:
      build: .
      container_name: flask-app
      networks:
        - three-tier
      ports:
        - "5000:5000"
      environment:
        MYSQL_HOST: mysql
        MYSQL_PASSWORD: root
        MYSQL_USER: root
        MYSQL_DATABASE: devops

      depends_on:
        - mysql

networks:
  three-tier:
