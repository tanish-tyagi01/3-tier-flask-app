services:
   mysql:
    image: mysql:8.0
    container_name: mysql
    networks:
      - three-tier
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



   flask-app:
      build: .
      container_name: flask-app
      networks:
        - three-tier
      env_file:
        - .env
      depends_on:
        mysql:
          condition: service_healthy

   nginx:
       image: nginx:latest
       container_name: todo-nginx
       ports:
        - "80:80"
       networks:
        - "three-tier"
       volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
       depends_on:
        - flask-app

networks:
  three-tier:
    driver: bridge
